[project]
name = "sea-memory"
version = "0.1.0"
description = "self-evolving-agent CLI — local-first Markdown memory system (memory layering / distillation / skill management)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13"]

[project.scripts]
sea = "sea.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sea"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
source = ["sea"]

[tool.coverage.report]
fail_under = 80
